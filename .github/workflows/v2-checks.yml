name: v2 checks
on:
  push:
    branches: [v2-rewrite]
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m py_compile scripts/configure.py
      - run: python3 -m unittest discover -s tests -v
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t send-only-postfix:test .
      - run: docker run --rm -e DOMAIN=example.com -e HOSTNAME_FQDN=relay.example.com -e MYNETWORKS=127.0.0.0/8 send-only-postfix:test check
